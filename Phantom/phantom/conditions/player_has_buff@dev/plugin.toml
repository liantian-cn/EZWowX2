name = "player_has_buff@dev"
assisted_combat_rule_types = ["ASSISTED_COMBAT_RULE_TYPE_AURA_ON_PLAYER", "ASSISTED_COMBAT_RULE_TYPE_AURA_MISSING_PLAYER"]
author = "liantian-cn"
version = "dev"
# 显示实现：CellBackplate 提供固定黑底和行宽登记，背板→AuraContainer→AuraButton 使用静态层级。
display_name = "玩家是否有任一指定增益"
description = "AuraContainer 单 slot 匹配任一配置 ID，白色贴图覆盖黑底；默认 HELPFUL|PLAYER，player_only=false 时使用 HELPFUL。PLAYER 包含玩家、玩家宠物和载具。不读取 aura 数据或显示状态，UpdateAllAuras() 请求刷新。"
recommended_condition_name = "玩家是否有任一指定增益"

[parameters.buff_ids]
type = "list[int]"
required = true
description = "非空正整数增益技能 ID 列表，任一存在即为真。"

[parameters.player_only]
type = "bool"
required = false
default = true
description = "默认仅匹配 PLAYER 来源（玩家、玩家宠物和载具）；false 允许任意来源的 HELPFUL 增益。"

[returns]
type = "bool"
description = "参考 04_player_buff.lua，单 slot 匹配任一 ID，白色贴图覆盖黑底；不读取 aura 数据或显示状态。"
fallback = false

# 刷新约定：事件通过 C_Timer.After(0, ...) 延后；无定时轮询。
