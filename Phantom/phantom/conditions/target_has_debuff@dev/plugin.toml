name = "target_has_debuff@dev"
author = "liantian-cn"
version = "dev"
# 显示实现：CellBackplate 提供固定黑底和行宽登记，背板→AuraContainer→AuraButton 使用静态层级。
display_name = "目标指定减益存在"
description = "官方 AuraContainer 单 AuraSlot 多 ID 首匹配，固定 PLAYER|HARMFUL，官方 PLAYER 包含玩家宠物和载具；不增加 player_only 参数。显示不可辅助目标的指定减益。身份分类使用 UnitCanAssist(player, target, true, true)，无目标或可辅助时为 false；不可辅助不等同于可攻击。Lua 不读取秘密光环数据。"
recommended_condition_name = "目标有{减益名称}"
assisted_combat_rule_types = ["ASSISTED_COMBAT_RULE_TYPE_AURA_ON_TARGET", "ASSISTED_COMBAT_RULE_TYPE_AURA_MISSING_TARGET"]

[parameters.aura_ids]
type = "list[int]"
required = true
description = "非空正整数光环 ID 列表；一个官方槽首匹配任意 ID，不保证按配置 ID 顺序。"

[returns]
type = "bool"
description = "纯白 Cell 为 true，纯黑为 false；异常像素或解码失败为 false。"
fallback = false
