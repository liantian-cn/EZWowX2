# AI Agent 自述；仅供检索，运行时不读取。
name = "spec_power_soul_shards@dev"
author = "liantian-cn"
version = "dev"
display_name = "玩家灵魂碎片"
recommended_condition_name = "灵魂碎片"
description = "固定 Enum.PowerType.SoulShards。缺省或 fractional=false 保留 UnitPower(player, powerType, false) 的整碎片 Cell：先检查 secret，再检查 0..255 整数，非法返回直接 Lua error。fractional=true 将 UnitPower(player, powerType, true) 原始片段直接交给固定范围 0..50 的 ValueBar，不在 Lua 对 secret 做运算或分支；Python 将比例恢复为整数片段后除以 10。初始化、进入世界及玩家资源、最大资源、显示资源变化时刷新；小数模式额外监听玩家 UNIT_POWER_FREQUENT，事件均延至下一帧且不读取资源事件参数。构造期固定布局，不随运行状态自动切换。"
assisted_combat_rule_types = ["ASSISTED_COMBAT_RULE_TYPE_SOUL_SHARDS_GREATER", "ASSISTED_COMBAT_RULE_TYPE_SOUL_SHARDS_LESS"]
[parameters.fractional]
type = "bool"
required = false
default = false
description = "是否返回包含十分之一碎片的浮点数量。严格布尔值；false 使用旧整数 Cell，true 使用 ValueBar。"
[parameters.width]
type = "int"
required = false
description = "仅 fractional=true 时接受的正整数内容宽度，以 Cell 为单位；缺省动态派生为 25，不静态补写。内容宽度为 4*width 像素，完整占位宽度为 4*(width+1)；实际像素精度取决于宽度和渲染，窄条不保证分辨全部片段。"
[returns]
type = "int | float"
unit = "灵魂碎片"
description = "整碎片模式：一个 4×4 灰度 Cell，返回 0..255 int，像素解码异常兜底 int 0，Lua 非法资源硬错误。小数模式：一个 ValueBar，返回片段格点对应的 0.0..5.0 float（名义步长 0.1），缺区域、解码异常或无黑白像素兜底 float 0.0。沿用 ValueBar 严格黑白像素计数，不额外验证红色分隔，畸形像素可能改变比例；零兜底仍会命中 <= 上限条件。"
