description = "UnitCastingInfo(\"player\") 第 11 项 delayTimeMs、UnitChannelInfo(\"player\") 第 9 项 isEmpowered 是 NeverSecret；后者返回通道是否蓄力的布尔值，无通道时无值。普通施法、普通通道及空闲为假，蓄力通道为真；不判断秘密名称或纹理。"
recommended_condition_name = "玩家是否正在蓄力"

