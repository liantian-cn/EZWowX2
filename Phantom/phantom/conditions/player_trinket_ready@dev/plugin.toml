name = "player_trinket_ready@dev"
author = "liantian-cn"
version = "dev"
display_name = "玩家饰品是否准备就绪"
description = "itemID = GetInventoryItemID(\"player\", slotID)；返回物品 ID 或 nil。start, duration, enabled = C_Item.GetItemCooldown(itemID)；usable, noMana = C_Item.IsUsableItem(itemID)。所选位置有物品、enabled 为真、duration 为零、usable 为真且 noMana 为假；不另查数量。"
recommended_condition_name = "玩家饰品是否准备就绪"

[parameters.slot_id]
type = "int"
required = true
description = "饰品位置 ID，只接受 13 或 14。"

[returns]
type = "bool"
description = "所选位置有物品、enabled 为真、duration 为零、usable 为真且 noMana 为假；不另查数量。"
fallback = false

# 刷新约定：事件通过 C_Timer.After(0, ...) 延后；UPDATE_INTERVAL = 1 秒兜底。
