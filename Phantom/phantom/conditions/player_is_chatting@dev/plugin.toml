name = "player_is_chatting@dev"
author = "liantian-cn"
version = "dev"
display_name = "玩家是否具有键盘输入焦点"
description = "frame = GetCurrentKeyBoardFocus()；返回输入焦点框体或 nil。EventRegistry:RegisterCallback(event, callback, owner) 注册聊天焦点通知。任意输入框获得焦点即为真，包含搜索框；保留聊天通知和1 秒兜底轮询。"
recommended_condition_name = "玩家是否具有键盘输入焦点"

[parameters]
description = "无参数，拒绝多余字段。"

[returns]
type = "bool"
description = "任意输入框获得焦点即为真，包含搜索框；保留聊天通知和1 秒兜底轮询。"
fallback = false

# 刷新约定：事件通过 C_Timer.After(0, ...) 延后；UPDATE_INTERVAL = 1 秒兜底。
