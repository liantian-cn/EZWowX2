name = "aura_player_buff_duration_pct@dev"
author = "liantian-cn"
version = "dev"
# 显示实现：直接使用 ValueBarBackplate；背板→AuraContainer→AuraButton→StatusBar，静态层级分别为 9600/9700/9750/9800，不创建默认半满条。
display_name = "玩家增益剩余时长百分比"
description = "官方 AuraContainer 单 AuraSlot 多 ID 首匹配玩家增益，默认 HELPFUL|PLAYER，player_only=false 时使用 HELPFUL。SetDurationBar 保留 Immediate / RemainingTime 原生时长比例；Lua 不读取秘密光环时长。固定内容宽度 5 Cell（20×4 像素），含两侧红色分隔占 6 Cell（24×4）；不接受 duration 或 width，不换算秒数。永久光环交官方处理，不保证满条；游戏渲染需另行验收。"
recommended_condition_name = "{增益名称}剩余时长百分比"
assisted_combat_rule_types = ["ASSISTED_COMBAT_RULE_TYPE_AURA_DURATION_PLAYER"]

[parameters.aura_ids]
type = "list[int]"
required = true
description = "非空正整数光环 ID 列表，不接受 bool；官方首匹配，不保证按配置 ID 顺序。"

[parameters.player_only]
type = "bool"
required = false
default = true
description = "默认仅匹配 PLAYER 来源（玩家、玩家宠物和载具）；false 允许任意来源的 HELPFUL 增益。构造与配置默认值补写共用 config_defaults。"

[returns]
type = "float"
unit = "%"
description = "单个 float scalar，原样返回 ValueBar.ratio * 100，范围 0.0–100.0，不 round、不硬量化为 5 倍数。两行一致且全黑白时，一整列名义步长为 5%；灰色从黑白分母排除，两行不一致可产生非 5 倍数。无光环、无有效黑白像素或解码异常返回 0.0。"
fallback = 0.0
