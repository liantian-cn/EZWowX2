# 此配置按冻结 TXT 显示顺序编制，来源及映射边界见项目规范。
# 唯一规则来源：deathknight/frost.txt；未读取 CSV 或补充隐藏字段。
# 所有叶子条件按 AND 保留顺序；无冷却标签按 0 秒；仅启用与动作冷却 >= 60 秒的爆发门控。
# 技能射程规则使用当前步骤动作 ID 对 target 的射程结果，无效射程返回 False。
# 天赋条件按技能 ID 查询已知/法术书状态，不解析天赋树。
# 资源可支付/成功施放规则映射 spell_usable 的 isUsable；不保证所有实际施放条件。
# 距离条件近似为当前步骤技能射程，忽略 TXT 码数；无效技能/无目标/nil 射程也返回 False。
# 玩家周围人数近似为本步骤技能可攻击敌人总数，仅可观察 nameplate1–40；secret/nil 射程漏计，不代表原码数圆内完整人数。
# 玩家光环限定 HELPFUL 增益；TXT 的增益/减益合称按现有插件能力映射。
# 资源 max_power 为固定参考，须按天赋调整；临时上限变化会有误差，Cell 量化步长约为 max_power/255。
# 层数使用固定显示量程；超量程饱和，零填充不能区分无光环与零层。
